# AeroSpace config - ported from i3 (mod = Option, same as Mod1/Alt on i3)

start-at-login = true
after-login-command = []
after-startup-command = []

# tell sketchybar which workspace is focused
exec-on-workspace-change = ['/bin/bash', '-c',
  '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

focus-follows-mouse.enabled = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

# outer.top leaves room for sketchybar (bar height 32 + 4)
[gaps]
inner.horizontal = 0
inner.vertical   = 0
outer.left       = 0
outer.bottom     = 0
outer.top        = 36
outer.right      = 0

[mode.main.binding]
# apps
alt-enter = 'exec-and-forget open -na Ghostty'
alt-e     = 'exec-and-forget open ~'            # Finder, like dolphin on hypr
alt-shift-c = 'close'                            # shift added, stop accidentally killing stuff

# focus (vim keys)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# layout
alt-f = 'fullscreen'
alt-v = 'layout floating tiling'                 # toggle floating
alt-s = 'layout v_accordion'                     # i3 stacking
alt-w = 'layout h_accordion'                     # i3 tabbed
alt-t = 'layout tiles horizontal vertical'       # toggle split (hypr togglesplit)

# workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-tab = 'workspace-back-and-forth'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# monitors
alt-m = 'move-workspace-to-monitor --wrap-around next'

# reload config
alt-shift-r = 'reload-config'

# resize mode (i3 style)
alt-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc   = 'mode main'
alt-r = 'mode main'

# apps that should float instead of tile
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'
