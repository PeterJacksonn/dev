# hyprlock.conf
$font = Iosevka Comfy
general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = overshot, 0.34, 1.56, 0.64, 1
    animation = fadeIn, 1, 3, easeOutQuint
    animation = fadeOut, 1, 3, easeOutQuint
    animation = inputFieldDots, 1, 2, overshot
    animation = inputFieldWidth, 1, 1.5, overshot
}
background {
    monitor =
    path = ~/.config/hypr/current_lock_bg
    blur_passes = 3
    blur_size = 1
    contrast = 0.9
    brightness = 0.65
    vibrancy = 0.15
}
input-field {
    monitor = DP-3
    size = 280, 56
    outline_thickness = 3
    inner_color = rgba(16, 16, 16, 0.85)
    outer_color = rgba(186, 187, 241, 0.9) rgba(133, 193, 220, 0.9) 45deg
    check_color = rgba(133, 193, 220, 0.95) rgba(202, 158, 230, 0.9) 120deg
    fail_color = rgba(231, 130, 132, 0.95) rgba(202, 158, 230, 0.85) 40deg
    font_color = rgb(198, 208, 245)
    fade_on_empty = false
    rounding = 10
    font_family = $font
    placeholder_text = <span foreground="##a5adce">Enter password...</span>
    fail_text = <span foreground="##e78284">$PAMFAIL</span>
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    position = 0, -160
    halign = center
    valign = center
}
# TIME
label {
    monitor = DP-3
    text = $TIME
    font_size = 110
    font_family = $font
    color = rgba(198, 208, 245, 1.0)
    position = 0, 60
    halign = center
    valign = center
}
# DATE
label {
    monitor = DP-3
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 24
    font_family = $font
    color = rgba(165, 173, 206, 1.0)
    position = 0, -40
    halign = center
    valign = center
}
# GREETING
label {
    monitor = DP-3
    text = Welcome back, pj
    font_size = 16
    font_family = $font
    color = rgba(186, 187, 241, 0.9)
    position = 0, -230
    halign = center
    valign = center
}
